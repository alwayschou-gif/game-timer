<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲建築升級提醒器</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .form-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
    input[type="text"] { flex: 1; min-width: 120px; }
    input[type="number"] { width: 70px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .timer-card { background: #f8f9fa; border-left: 5px solid #007bff; padding: 12px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .timer-card.finished { border-left-color: #28a745; background: #e8f5e9; }
    .info { font-size: 14px; line-height: 1.4; }
    .time-left { font-size: 18px; font-weight: bold; color: #d9534f; }
    .del-btn { background: #dc3545; padding: 6px 10px; font-size: 12px; }
    .del-btn:hover { background: #c82333; }
  </style>
</head>
<body>

<div class="container">
  <h2>🏰 建築升級提醒器</h2>
  
  <div class="form-group">
    <input type="text" id="account" placeholder="帳號名稱 (如: 帳號A)">
    <input type="text" id="building" placeholder="建築 (如: 城堡Lv10)">
    <input type="number" id="hours" placeholder="時" min="0" value="0">
    <input type="number" id="minutes" placeholder="分" min="0" value="0">
    <button onclick="addTimer()">新增計時器</button>
  </div>

  <div id="timer-list"></div>
</div>

<script>
  let timers = JSON.parse(localStorage.getItem('game_timers') || '[]');

  // 請求通知權限
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
  }

  function saveTimers() {
    localStorage.setItem('game_timers', JSON.stringify(timers));
  }

  function addTimer() {
    const account = document.getElementById('account').value.trim() || '主帳號';
    const building = document.getElementById('building').value.trim() || '建築升級';
    const hours = parseInt(document.getElementById('hours').value) || 0;
    const minutes = parseInt(document.getElementById('minutes').value) || 0;

    const totalMs = (hours * 3600 + minutes * 60) * 1000;
    if (totalMs <= 0) return alert('請輸入有效的升級時間！');

    const targetTime = Date.now() + totalMs;
    const newTimer = { id: Date.now(), account, building, targetTime, notified: false };

    timers.push(newTimer);
    saveTimers();
    renderTimers();
  }

  function deleteTimer(id) {
    timers = timers.filter(t => t.id !== id);
    saveTimers();
    renderTimers();
  }

  function formatTimeLeft(ms) {
    if (ms <= 0) return "已完成！";
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return `${h}小時 ${m}分 ${s}秒`;
  }

  function sendNotification(title, body) {
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/3602/3602145.png' });
    }
  }

  function renderTimers() {
    const listEl = document.getElementById('timer-list');
    listEl.innerHTML = '';

    const now = Date.now();

    timers.sort((a, b) => a.targetTime - b.targetTime);

    timers.forEach(t => {
      const msLeft = t.targetTime - now;
      const isFinished = msLeft <= 0;

      if (isFinished && !t.notified) {
        t.notified = true;
        saveTimers();
        sendNotification('⚔️ 建築升級完成！', `[${t.account}] 的 ${t.building} 已順利完工！`);
      }

      const card = document.createElement('div');
      card.className = `timer-card ${isFinished ? 'finished' : ''}`;
      
      const endTimeStr = new Date(t.targetTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      card.innerHTML = `
        <div class="info">
          <strong>[${t.account}] ${t.building}</strong><br>
          <small>預計完成時間: ${endTimeStr}</small>
        </div>
        <div>
          <span class="time-left">${formatTimeLeft(msLeft)}</span>
          <button class="del-btn" onclick="deleteTimer(${t.id})">刪除</button>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  setInterval(renderTimers, 1000);
  renderTimers();
</script>
</body>
</html>
